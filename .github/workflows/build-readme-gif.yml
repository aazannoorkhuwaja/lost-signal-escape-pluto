name: Build README gameplay GIF

on:
  push:
    paths:
      - '.github/workflows/build-readme-gif.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert the published gameplay demo into an auto-looping GIF
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          curl --fail --location --retry 3 --silent --show-error             'https://github.com/aazannoorkhuwaja/lost-signal-escape-pluto/releases/download/pluto-campaign/LostSignal-demo.mp4'             --output /tmp/lostsignal-demo.mp4
          mkdir -p docs/images
          ffmpeg -hide_banner -loglevel error             -ss 23 -t 10 -i /tmp/lostsignal-demo.mp4             -ss 42 -t 3 -i /tmp/lostsignal-demo.mp4             -ss 54 -t 8 -i /tmp/lostsignal-demo.mp4             -filter_complex '[0:v]fps=8,scale=560:-2:flags=lanczos,setsar=1[v0];[1:v]fps=8,scale=560:-2:flags=lanczos,setsar=1[v1];[2:v]fps=8,scale=560:-2:flags=lanczos,setsar=1[v2];[v0][v1][v2]concat=n=3:v=1:a=0,split[p][s];[p]palettegen=max_colors=96:stats_mode=diff[pal];[s][pal]paletteuse=dither=bayer:bayer_scale=4:diff_mode=rectangle[out]'             -map '[out]' -loop 0 -y docs/images/gameplay-demo.gif
          file docs/images/gameplay-demo.gif
          test -s docs/images/gameplay-demo.gif
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/gameplay-demo.gif
          if ! git diff --cached --quiet; then
            git commit -m "Add looping gameplay demo GIF to README assets"
            git push origin HEAD:main
          fi
